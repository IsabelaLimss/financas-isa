<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#075138">
  <meta name="description" content="Controle local e privado de empréstimos, pagamentos e antecipações.">
  <title>Controle Financeiro</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="favicon-32.png" sizes="32x32">
  <link rel="icon" type="image/png" href="favicon-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="workbook">
  <header class="workbook-bar">
    <div class="file-label"><span class="file-glyph" aria-hidden="true">▤</span> Controle Financeiro <span class="title-suffix">— controle financeiro</span></div>
    <div class="top-tools">
      <span class="save-label" id="save-status" role="status">Dados salvos neste navegador</span>
      <button class="action-btn" id="export" title="Exportar seus dados em JSON" type="button">Exportar backup</button>
      <button class="action-btn" id="import" title="Importar seus dados de arquivo JSON" type="button">Importar backup</button>
      <input type="file" id="upload" accept="application/json,.json" hidden>
    </div>
  </header>
  <div class="sheet">
    <main class="sheet-inner">
      <div class="sheet-heading">
        <div class="heading-left"><div class="stack-icon" aria-hidden="true"><svg viewBox="0 0 36 36" width="37" height="37"><ellipse cx="14" cy="8" rx="10" ry="4"/><path d="M4 8v7c0 2 4 4 10 4s10-2 10-4V8"/><path d="M4 15v7c0 2 4 4 10 4s10-2 10-4v-7"/><ellipse cx="23" cy="22" rx="9" ry="4"/><path d="M14 22v7c0 2 4 4 9 4s9-2 9-4v-7"/></svg></div><div><h1>Controle de Empréstimos</h1><p class="heading-subtitle">Consignados e Shopee</p></div></div>
        <div class="update-chip"><svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/></svg><span>Atualizado neste navegador <strong id="today"></strong></span></div>
      </div>
      <nav class="section-switcher" aria-label="Áreas do controle financeiro">
        <button type="button" id="switch-loans" class="section-switch active" aria-current="page">Empréstimos</button>
        <button type="button" id="switch-wealth" class="section-switch">Receitas e dívidas</button>
        <button type="button" id="switch-credit" class="section-switch">Cartão de crédito</button>
        <button type="button" id="switch-expenses" class="section-switch">Despesas</button>
      </nav>
      <section id="view" aria-live="polite"></section>
      <section id="wealth-view" aria-live="polite" hidden></section>
      <section id="credit-view" aria-live="polite" hidden></section>
      <section id="expenses-view" aria-live="polite" hidden></section>
    </main>
    <nav class="sheet-tabs" id="tabs" aria-label="Abas dos empréstimos"></nav>
    <footer class="sheet-footer"><span>Salvamento local • Sem sincronização entre dispositivos • <strong>Sem SParcelado</strong></span><button type="button" id="reset" class="footer-link">Limpar os dados deste navegador</button></footer>
  </div>
</div>
<dialog id="contract-dialog" class="contract-dialog" aria-labelledby="dialog-title">
<form method="dialog" id="contract-form">
  <div class="dialog-heading"><div><h2 id="dialog-title">Editar dados do contrato</h2><p>Campos não confirmados podem permanecer vazios.</p></div><button type="button" class="close-icon" id="close-dialog" aria-label="Fechar">×</button></div>
  <div id="contract-fields" class="contract-fields"></div>
  <div class="dialog-actions"><button type="button" class="btn subdued" id="cancel-dialog">Cancelar</button><button type="submit" class="btn primary" id="save-contract">Salvar alterações</button></div>
</form>
</dialog>
<dialog id="wealth-dialog" class="wealth-dialog" aria-labelledby="wealth-dialog-title"><div id="wealth-dialog-content"></div></dialog>
<dialog id="finance-dialog" class="finance-dialog" aria-labelledby="finance-dialog-title"><div id="finance-dialog-content"></div></dialog>
<div class="toast-area" id="toast-area" role="status"></div>
<script src="data.js"></script><script src="app.js"></script><script src="patrimonio.js"></script><script src="financas.js"></script>
</body>
</html>
